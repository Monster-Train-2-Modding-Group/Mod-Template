[config]
schemaVersion = "0.0.1"

[package]
# Do not edit namespace or name if using Github actions to publish your mod
namespace = "{{cookiecutter.mod_namespace}}"
name = "{{cookiecutter.__project_slug}}"
versionNumber = "0.1.0"
description = "{{cookiecutter.description}}"
# Please change this to a GitHub respository prior to your first release for a way for folks to give feedback.
websiteUrl = "https://thunderstore.io"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"
MT2-Trainworks_Reloaded = "0.8.1"
Conductor-Conductor = "0.6.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./"

[[build.copy]]
source = "./plugin_build"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = [ "monster-train-2" ]

# Please categorize your mod for searchabiliity
#
# Available categories
# ---
# audio, balance, battles, clans, cosmetic, events,
# libraries, meme, merchants, misc, modpacks,
# mods, mutators, quality-of-life, tools, translation
# ui
#
# If your mod is ai generated (art/code) please tag it as such "ai-generated"
[publish.categories]
monster-train-2 = ["mods"]

